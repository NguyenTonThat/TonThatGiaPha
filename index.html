function patchSVG(Wd,Hd){
  // Che chữ in sẵn trên hai tấm biển bằng mảnh nền đỏ sạch (ảnh thường, không dùng mask hay filter
  // vì Safari trên điện thoại vẽ các thứ đó không ổn định).
  const sx=Wd/1536, sy=Hd/1024; let body='';
  PLAQUE_PATCHES.forEach(p=>{
    body+=`<image href="${p.src}" x="${(p.x*sx).toFixed(2)}" y="${(p.y*sy).toFixed(2)}" width="${(p.w*sx).toFixed(2)}" height="${(p.h*sy).toFixed(2)}" preserveAspectRatio="none"/>`;
  });
  return {defs:'',body};
}
function bannerSVG(Wd,Hd,canEdit){
  const sx=Wd/1536, sy=Hd/1024; let s='';
  for(const k of Object.keys(BANNER_BOX)){
    const B=BANNER_BOX[k], txt=String(BANNER[k]||'').toLocaleUpperCase('vi'); if(!txt) continue;
    let S=B.S0*sy; const maxW=B.max*sx; let w0=pTW(txt,true,S), cx=1;
    if(w0>maxW){   // quá dài: co ngang chữ đến 82%, còn dài nữa thì giảm cỡ chữ
      const ratio=maxW/w0; cx=Math.max(ratio,0.82);
      if(ratio<0.82) S=S*ratio/0.82;
    }
    const x=(B.cx*sx).toFixed(1), y=(B.base*sy).toFixed(1), fs=S.toFixed(1);
    const tf=`translate(${x} ${y}) scale(${cx.toFixed(3)} 1)`;
    s+=`<text transform="${tf}" x="1.5" y="2" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#2a0c04" fill-opacity=".6">${esc(txt)}</text>`;
    s+=`<text transform="${tf}" x="0" y="0" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#F5D47C" stroke="#5c240b" stroke-width="1.2" stroke-linejoin="round" paint-order="stroke" data-ed="${k}"${canEdit?' style="cursor:pointer"':''}>${esc(txt)}</text>`;
  }
  return s;
}
function applyBanner(){ const h1=document.querySelector('.plaque h1'); if(h1) h1.textContent=String(BANNER.main||BANNER_DEF.main).toLocaleUpperCase('vi'); }
async function loadBanner(){
  let local={}, db={};
  try{ local=JSON.parse(localStorage.getItem(BANNER_LOCAL)||'{}')||{}; }catch(e){}
  try{
    const {data,error}=await sb.from('site_settings').select('key,value');
    if(!error && data){ const inv=Object.fromEntries(Object.entries(BANNER_KEYS).map(([k,v])=>[v,k])); data.forEach(r=>{ if(inv[r.key]) db[inv[r.key]]=r.value; }); }
  }catch(e){}
  BANNER={...BANNER_DEF,...local,...db};
  applyBanner();
}
function openBannerEditor(focusKey){
  if(!isAdmin) return;
  const F=[['small','Dòng nhỏ phía trên'],['main','Tên chính (chữ to)'],['branch','Chi nhánh, địa danh'],['motto1','Khẩu hiệu, dòng 1'],['motto2','Khẩu hiệu, dòng 2']];
  openModal(`<h3>Sửa chữ trên biển</h3>
    <p class="sub">Chữ tự viết in hoa và tự co giãn cho vừa tấm biển. Để trống một dòng nếu muốn bỏ dòng đó.</p>
    <div class="fgrid">${F.map(([k,l])=>`<label class="full">${l}<input id="bn_${k}" maxlength="80" value="${esc(BANNER[k]||'')}" placeholder="${esc(BANNER_DEF[k])}"></label>`).join('')}</div>
    <div class="err" id="bn_err"></div>
    <div class="actions"><button class="btn primary" id="bn_save">Lưu</button><button class="btn" id="bn_reset">Khôi phục chữ gốc</button><button class="btn" id="bn_cancel">Hủy</button></div>`);
  const err=m=>{ $('#bn_err').textContent=m; };
  const done=async(vals,msg)=>{ BANNER={...BANNER_DEF,...vals}; applyBanner(); closeModal(); await renderPoster(); toast(msg); };
  $('#bn_save').onclick=async ()=>{
    const vals={}; F.forEach(([k])=>{ vals[k]=$('#bn_'+k).value.replace(/\s+/g,' ').trim(); });
    if(!vals.main) return err('Tên chính không được để trống.');
    $('#bn_save').disabled=true;
    const rows=Object.entries(BANNER_KEYS).map(([k,key])=>({key, value:vals[k]}));
    const {error}=await sb.from('site_settings').upsert(rows,{onConflict:'key'});
    if(error){
      try{ localStorage.setItem(BANNER_LOCAL,JSON.stringify(vals)); }catch(e){}
      await done(vals,'Đã lưu trên máy này. Chưa lưu được lên Supabase (cần chạy file cai_dat.sql).');
    } else {
      try{ localStorage.removeItem(BANNER_LOCAL); }catch(e){}
      await done(vals,'Đã lưu chữ trên biển');
    }
  };
  $('#bn_reset').onclick=async ()=>{
    if(!confirm('Khôi phục toàn bộ chữ trên biển về như ban đầu?')) return;
    await sb.from('site_settings').delete().in('key',Object.values(BANNER_KEYS));
    try{ localStorage.removeItem(BANNER_LOCAL); }catch(e){}
    await done({}, 'Đã khôi phục chữ gốc');
  };
  $('#bn_cancel').onclick=closeModal;
  setTimeout(()=>{ const el=$('#bn_'+(focusKey||'main')); if(el){ el.focus(); el.select(); } },60);
}

function detectBaked(i){   // ảnh nền còn chữ vàng in sẵn trên biển? true / false / null (không đọc được điểm ảnh)
  try{
    const c=document.createElement('canvas'); c.width=i.naturalWidth; c.height=i.naturalHeight;
    const x=c.getContext('2d'); x.drawImage(i,0,0); const k=i.naturalWidth/1536;
    const d=x.getImageData(Math.round(560*k),Math.round(108*k),Math.max(1,Math.round(420*k)),Math.max(1,Math.round(40*k))).data;
    let n=0; for(let q=0;q<d.length;q+=4){ if(d[q]>150&&d[q+1]>110&&d[q+2]<120&&d[q]-d[q+2]>55) n++; }
    return n>150;
  }catch(e){ return null; }
}
function probeImg(u){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res({url:u,w:i.naturalWidth,h:i.naturalHeight,baked:detectBaked(i)}); i.onerror=()=>res(null); i.src=u; }); }
async function ensureBg(){
  if(bgAvail===undefined){ bgAvail=(await probeImg(BG_EDIT_FILE)) || (await probeImg(BG_FILE)); }
  return bgAvail;
}

$('#pPng').onclick=async ()=>{
  if(!lastPoster) return;
  let {svg,W,H,imgUrl}=lastPoster;
  if(imgUrl){
    try{
      const blob=await (await fetch(imgUrl)).blob();
      const du=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
      svg=svg.replace(`href="${esc(imgUrl)}"`,`href="${du}"`);
    }catch(e){ toast('Không nhúng được ảnh nền. Hãy dùng In hoặc lưu PDF.'); return; }
  }
  const tw=Math.min(4800, Math.round(W*2.2)), th=Math.round(tw*H/W);
  const sized=svg.replace('<svg ',`<svg width="${tw}" height="${th}" `);
  const url=URL.createObjectURL(new Blob([sized],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=tw; cv.height=th;
    cv.getContext('2d').drawImage(img,0,0,tw,th);
    URL.revokeObjectURL(url);
    cv.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`gia-pha-ton-that-${new Date().toISOString().slice(0,10)}.png`; a.click(); },'image/png');
  };
  img.onerror=()=>toast('Không tạo được ảnh. Hãy dùng In hoặc lưu PDF.');
  img.src=url;
};

function fmtField(k,v){
  if(v===null||v===undefined||v==='') return '(trống)';
  if(k==='gender') return v==='M'?'Nam':'Nữ';
  if(k==='is_alive') return v?'Còn sống':'Đã mất';
  if(k==='birth_date'||k==='death_date') return dateWithLunar(v);
  if(k==='father_id'||k==='mother_id'||k==='spouse_of') return byId.get(v)?.full_name || '(không rõ)';
  return String(v);
}

function histKey(p){ return 'gp_contrib_hist:'+pkNorm((p.name||'')+'|'+(p.contact||'')); }

function newUUID(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });
}

function contribRateOk(){
  try{
    const key='gp_contrib', now=Date.now();
    const arr=JSON.parse(localStorage.getItem(key)||'[]').filter(t=>now-t<3600e3);
    if(arr.length>=20) return false;
    arr.push(now); localStorage.setItem(key,JSON.stringify(arr));
  }catch(e){}
  return true;
}

  openModal(`<h3>Đóng góp của tôi</h3><p class="sub">Đang tải…</p>`);
  if(hist.length){
    try{
      const {data,error}=await sb.rpc('my_contribution_status',{p_ids:hist.map(x=>x.id)});
      if(error||!data) note='Chưa cập nhật được tình trạng mới nhất (cần chạy file nguoi_dong_gop.sql).';

        const m=new Map(data.map(d=>[d.id,d]));
        hist=hist.map(x=>m.has(x.id)?{...x,status:m.get(x.id).status,reason:m.get(x.id).reject_reason}:{...x,status:x.status==='pending'?'gone':x.status});

function contribSubject(c){ return c.kind==='new_person' ? (c.payload?.full_name||'(chưa có tên)') : (byId.get(c.target_person_id)?.full_name || '(người đã bị xóa)'); }
function renderContribs(){
  if(!isAdmin) return '<div class="empty">Chỉ quản trị viên xem được mục này.</div>';
  const cnt=s=>contribs.filter(c=>c.status===s).length;
  const chips=[['pending','Chờ duyệt'],['approved','Đã duyệt'],['rejected','Từ chối']].map(([k,l])=>`<button class="chip" data-dgf="${k}" aria-pressed="${dgFilter===k}">${l} (${cnt(k)})</button>`).join('');
  const list=contribs.filter(c=>c.status===dgFilter);
  const items=list.map(c=>`<div class="citem" data-cid="${c.id}" tabindex="0">
      <span class="ck">${c.kind==='new_person'?'Thêm người':'Sửa thông tin'}</span>
      <div><div class="nm">${esc(contribSubject(c))}</div><div class="sub">${esc(c.contributor_name)}, ${esc(new Date(c.created_at).toLocaleString('vi-VN'))}</div></div></div>`).join('');
  return `<div class="chips">${chips}</div>` + (items || `<div class="empty">${dgFilter==='pending'?'Chưa có đóng góp nào chờ duyệt.':'Không có mục nào.'}</div>`);
}
function diffContrib(c){
  const t=byId.get(c.target_person_id); if(!t) return null;
  const norm=x=>(x===''||x===undefined)?null:x;
  return Object.keys(c.payload).filter(k=>FIELD_LABELS[k] && norm(c.payload[k])!==norm(t[k])).map(k=>({k,old:t[k],nw:c.payload[k]}));
}
function reviewContrib(id){
  const c=contribs.find(x=>x.id===id); if(!c) return;
  const isNew=c.kind==='new_person', pending=c.status==='pending';
  let body='', d=null;
  if(isNew){
    const rows=Object.keys(c.payload).filter(k=>FIELD_LABELS[k] && k!=='sort_order' && c.payload[k]!==null && c.payload[k]!=='').map(k=>[FIELD_LABELS[k],fmtField(k,c.payload[k])]);
    body=`<dl>${rows.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`;
  } else {
    d=diffContrib(c);
    body = d===null ? '<p class="err">Người cần sửa không còn trong gia phả.</p>'
      : d.length===0 ? '<p class="sub">Không có thay đổi nào so với dữ liệu hiện tại.</p>'
      : `<table class="diff"><tr><th>Mục</th><th>Hiện tại</th><th>Đề xuất</th></tr>${d.map(x=>`<tr><td>${esc(FIELD_LABELS[x.k])}</td><td class="old">${esc(fmtField(x.k,x.old))}</td><td class="new">${esc(fmtField(x.k,x.nw))}</td></tr>`).join('')}</table>`;
  }
  const broken = !isNew && d===null;   // đề xuất sửa nhưng người đó đã bị xóa
  const same=contribs.filter(x=>pkNorm(x.contributor_name)===pkNorm(c.contributor_name) && (x.contributor_contact||'')===(c.contributor_contact||''));
  const sameInfo=same.length>1 ? `<br><span class="sub">Người này đã gửi ${same.length} đóng góp, ${same.filter(x=>x.status==='approved').length} đã duyệt</span>` : '';
  const status = pending ? '' : `<p class="sub">${c.status==='approved'?'Đã duyệt':'Đã từ chối'}${c.reject_reason?': '+esc(c.reject_reason):''}</p>`;
  openModal(`
    <h3>${isNew?'Đề xuất thêm':'Đề xuất sửa'}: ${esc(contribSubject(c))}</h3>
    <div class="cwho"><b>${esc(c.contributor_name)}</b>${c.contributor_contact?', liên hệ: '+esc(c.contributor_contact):''}<br><span class="sub">${esc(new Date(c.created_at).toLocaleString('vi-VN'))}</span>${sameInfo}</div>
    ${c.note?`<div class="cnote">Lời nhắn: ${esc(c.note)}</div>`:''}
    ${body}${status}
    <div class="actions">${pending?`
      <button class="btn primary small" id="rOk" ${broken?'disabled':''}>Duyệt</button>
      <button class="btn small" id="rEdit" ${broken?'disabled':''}>Sửa rồi duyệt</button>
      <button class="btn danger small" id="rNo">Từ chối</button>`:`<button class="btn danger small" id="rDel">Xóa khỏi danh sách</button>`}
      <button class="btn small" id="rClose">Đóng</button>
    </div>`);
  $('#rClose').onclick=closeModal;
  if(pending){
    $('#rOk').onclick=async ()=>{
      if(isNew && !c.payload.father_id && !c.payload.mother_id && !c.payload.spouse_of && !confirm('Người này chưa có quan hệ cha mẹ hoặc vợ/chồng nên sẽ hiện thành một nhánh riêng. Vẫn duyệt?')) return;
      $('#rOk').disabled=true; const msg=await approveContrib(c,c.payload); if(msg){ $('#rOk').disabled=false; toast('Lỗi: '+msg); }
    };
    $('#rEdit').onclick=()=>{
      const base = isNew ? {...c.payload} : {...byId.get(c.target_person_id), ...c.payload};
      openForm(base, {}, {title:'Sửa rồi duyệt đóng góp', save:row=>approveContrib(c,row), cancel:()=>reviewContrib(c.id)});
    };
    $('#rNo').onclick=async ()=>{
      const reason=prompt('Lý do từ chối (có thể bỏ trống):'); if(reason===null) return;
      const {error}=await sb.from('contributions').update({status:'rejected',reject_reason:reason.trim()||null,reviewed_at:new Date().toISOString(),reviewed_by:adminUid}).eq('id',c.id);
      if(error){ toast('Lỗi: '+error.message); return; }
      closeModal(); toast('Đã từ chối'); await loadContribs(); render();
    };
  } else {
    $('#rDel').onclick=async ()=>{
      if(!confirm('Xóa đóng góp này khỏi danh sách?')) return;
      const {error}=await sb.from('contributions').delete().eq('id',c.id);
      if(error){ toast('Lỗi: '+error.message); return; }
      closeModal(); await loadContribs(); render();
    };
  }
}
async function approveContrib(c,row){
  const {error}=await sb.rpc('approve_contribution',{p_id:c.id,p_row:row});
  if(error) return error.message;
  closeModal(); toast('Đã duyệt và đưa vào gia phả');
  await refresh(); await loadContribs(); render();
  return null;
}
$('#btnContrib').onclick=openContribMenu;

/* ---------- Đăng nhập quản trị ---------- */
function setAdmin(on){
  isAdmin = on;
  $('#btnAuth').textContent = on ? 'Đăng xuất' : 'Quản trị';
  $('#btnAddRoot').style.display = on ? '' : 'none';
  $('#btnExport').style.display = on ? '' : 'none';
  $('#tabDg').hidden = !on;
  if(!on && tab==='dg'){ pendingTab='dg'; tab='tree'; document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab==='tree')); }
  if(on && pendingTab && tab!==pendingTab){ tab=pendingTab; document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===tab)); }
  if(on) pendingTab=null;
  if(on) loadContribs().then(render); else { contribs=[]; updBadge(); }
  render();
}
$('#btnAuth').onclick = async ()=>{
  if(!configured) return;
  if(isAdmin){ await sb.auth.signOut(); return; }
  openModal(`<h3>Đăng nhập quản trị</h3>
    <div class="fgrid"><label class="full">Email<input id="a_email" type="email" autocomplete="username"></label>
    <label class="full">Mật khẩu<input id="a_pw" type="password" autocomplete="current-password"></label></div>
    <div class="err" id="aerr"></div>
    <div class="actions"><button class="btn primary" id="aGo">Đăng nhập</button></div>`);
  const go = async ()=>{
    const {error} = await sb.auth.signInWithPassword({email:$('#a_email').value.trim(), password:$('#a_pw').value});
    if(error) $('#aerr').textContent='Sai email hoặc mật khẩu.'; else closeModal();
  };
  $('#aGo').onclick = go;
  $('#a_pw').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
};
$('#btnAddRoot').onclick = ()=>openForm({}, {sort_order:roots().length+1});
$('#btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(persons,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download = `gia-pha-ton-that-${new Date().toISOString().slice(0,10)}.json`; a.click();
};

async function refresh(){ try{ await loadAll(); }catch(e){ $('#view').innerHTML=`<div class="notice">Không tải được dữ liệu: ${esc(e.message)}<br>Kiểm tra đã chạy <code>schema.sql</code> và đúng URL/key.</div>`; return; } if(open.size===0 && !uiRestored) roots().forEach(r=>open.add(r.id)); render(); }

(async function init(){
  if(!configured){ render(); $('#btnAuth').disabled=true; return; }
  const {data:{session}} = await sb.auth.getSession();
  isAdmin = !!session; adminUid = session?.user?.id || null;
  sb.auth.onAuthStateChange((_ev, s)=>{ adminUid = s?.user?.id || null; setAdmin(!!s); });
  // khôi phục màn hình lần trước
  const ui=loadUI();
  if(ui){
    if(['tree','gio','goc','dg','kin'].includes(ui.tab)){ tab=ui.tab; if(ui.tab==='dg') pendingTab='dg'; }
    query=ui.q||''; $('#q').value=query;
    dgFilter=['pending','approved','rejected'].includes(ui.dg)?ui.dg:'pending';
    if(Array.isArray(ui.open)) ui.open.forEach(id=>open.add(id));
    uiRestored=true;
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===tab));
  }
  loadBanner();
  await refresh();
  uiRestored=false;
  setAdmin(isAdmin);
  if(ui){
    requestAnimationFrame(()=>{
      if(ui.y) window.scrollTo(0,ui.y);
      if(ui.d && byId.has(ui.d) && Date.now()-(ui.t||0) < 30*60e3) showDetail(ui.d);   // mở lại người đang xem (trong 30 phút)
    });
  }
})();
</script>
