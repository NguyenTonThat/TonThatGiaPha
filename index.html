  } else {
    $('#pageCss').textContent=`@page{size:${size} ${r.ori};margin:0}`;
    const note = useImg ? ` (chưa thấy file ${BG_FILE} cạnh index.html, đang dùng nền vẽ đơn giản)` : '';
    $('#pInfo').textContent=`${size}, ${r.ori==='portrait'?'giấy dọc':'giấy ngang'}${note}`;
  }
}
function fillFrom(){
  const sel=$('#pFrom'), n=Math.max(1,maxDepth());
  sel.innerHTML='';
  for(let g=1; g<=n; g++){ const o=document.createElement('option'); o.value=g; o.textContent = g===1 ? 'Tất cả các đời' : `Từ đời ${g+genOff()} trở xuống`; sel.appendChild(o); }
  sel.value=1;   // mặc định in hết
}
function openPoster(){ document.body.classList.add('poster-open'); $('#poster').hidden=false; fillFrom(); renderPoster(); }
function closePoster(){ $('#poster').hidden=true; document.body.classList.remove('poster-open'); }
['pSize','pOri','pText','pBg','pFrom'].forEach(id=>$('#'+id).addEventListener('change',renderPoster));
$('#pPrint').onclick=()=>window.print();
$('#pClose').onclick=closePoster;
$('#pPng').onclick=async ()=>{
  if(!lastPoster) return;
  let {svg,W,H,imgUrl}=lastPoster;
  if(imgUrl){
    try{
      const blob=await (await fetch(imgUrl)).blob();
      const du=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
      svg=svg.replace(`href="${esc(imgUrl)}"`,`href="${du}"`);
    }catch(e){ toast('Không nhúng được ảnh nền. Hãy dùng In hoặc lưu PDF.'); return; }
  }
  const tw=Math.min(4800, Math.round(W*2.2)), th=Math.round(tw*H/W);
  const sized=svg.replace('<svg ',`<svg width="${tw}" height="${th}" `);
  const url=URL.createObjectURL(new Blob([sized],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=tw; cv.height=th;
    cv.getContext('2d').drawImage(img,0,0,tw,th);
    URL.revokeObjectURL(url);
    cv.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`gia-pha-ton-that-${new Date().toISOString().slice(0,10)}.png`; a.click(); },'image/png');
  };
  img.onerror=()=>toast('Không tạo được ảnh. Hãy dùng In hoặc lưu PDF.');
  img.src=url;
};
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#poster').hidden && !$('#bd').classList.contains('open')) closePoster(); });

/* ---------- Đóng góp từ người xem, quản trị duyệt ---------- */
const FIELD_LABELS={full_name:'Họ và tên',alias:'Tên húy / hiệu',generation_word:'Chữ đệm / chữ đời',gender:'Giới tính',birth_date:'Ngày sinh',birth_year:'Năm sinh',death_date:'Ngày mất',death_year:'Năm mất',death_lunar:'Ngày giỗ (âm lịch)',is_alive:'Tình trạng',hometown:'Quê quán / nơi ở',occupation:'Nghề nghiệp',burial_place:'Phần mộ',notes:'Ghi chú',photo_url:'Link ảnh',father_id:'Cha',mother_id:'Mẹ',spouse_of:'Là vợ/chồng của',sort_order:'Thứ tự anh chị em'};
function fmtField(k,v){
  if(v===null||v===undefined||v==='') return '(trống)';
  if(k==='gender') return v==='M'?'Nam':'Nữ';
  if(k==='is_alive') return v?'Còn sống':'Đã mất';
  if(k==='birth_date'||k==='death_date') return dateWithLunar(v);
  if(k==='father_id'||k==='mother_id'||k==='spouse_of') return byId.get(v)?.full_name || '(không rõ)';
  return String(v);
}
function contribRateOk(){
  try{
    const key='gp_contrib', now=Date.now();
    const arr=JSON.parse(localStorage.getItem(key)||'[]').filter(t=>now-t<3600e3);
    if(arr.length>=5) return false;
    arr.push(now); localStorage.setItem(key,JSON.stringify(arr));
  }catch(e){}
  return true;
}
function openContribMenu(){
  if(!configured) return;
  openModal(`<h3>Đóng góp thông tin</h3>
    <p class="sub">Mọi đóng góp đều được quản trị viên xem lại trước khi đưa vào gia phả.</p>
    <button class="menu-btn" id="mNew"><b>Thêm người vào gia phả</b><span>Con, cháu, dâu, rể hoặc người còn thiếu</span></button>
    <button class="menu-btn" id="mEdit"><b>Sửa hoặc bổ sung thông tin một người</b><span>Chỉnh ngày sinh, ngày mất, quê quán, ảnh…</span></button>
    <div id="mPick" hidden>
      <div class="fgrid"><label class="full">Chọn người cần sửa<select id="mPerson">${opts(()=>true,null)}</select></label></div>
      <div class="actions"><button class="btn primary" id="mGo">Tiếp tục</button></div>
    </div>`);
  enhancePicker($('#mPerson'),'Gõ tên người cần sửa…');
  $('#mNew').onclick=()=>openContribForm('new_person');
  $('#mEdit').onclick=()=>{ $('#mPick').hidden=false; $('#mPerson').parentNode.querySelector('.pk-in').focus(); };
  $('#mGo').onclick=()=>{ const t=byId.get($('#mPerson').value); if(t) openContribForm('edit_person',t); };
}
function openContribForm(kind, target, preset={}){
  const isEdit = kind==='edit_person';
  const v = isEdit ? {...target} : {gender:'M', ...preset};
  const val = k => esc(v[k] ?? '');
  const relSel = preset.rel || 'child';
  openModal(`
    <h3>${isEdit?'Đề xuất sửa: '+esc(target.full_name):'Thêm người vào gia phả'}</h3>
    <p class="sub">Thông tin sẽ hiện trên gia phả sau khi quản trị viên duyệt.</p>
    <div class="fgrid">
      ${isEdit?'':`
      <label>Người này là<select id="c_rel"><option value="child" ${relSel==='child'?'selected':''}>Con của</option><option value="spouse" ${relSel==='spouse'?'selected':''}>Vợ hoặc chồng của</option><option value="unknown">Chưa rõ quan hệ</option></select></label>
      <label id="c_relp_wrap">Chọn người<select id="c_relp">${opts(()=>true, preset.relPerson)}</select></label>`}
      <label class="full">Họ và tên *<input id="f_full_name" maxlength="120" value="${val('full_name')}" placeholder="Tôn Thất …"></label>
      <label>Tên húy / hiệu<input id="f_alias" maxlength="120" value="${val('alias')}"></label>
      <label>Giới tính<select id="f_gender"><option value="M" ${v.gender!=='F'?'selected':''}>Nam</option><option value="F" ${v.gender==='F'?'selected':''}>Nữ</option></select></label>
      <div class="dgwrap">
        ${dateGroup('birth','Ngày sinh',v.birth_date)}
        <label>Năm sinh (chỉ nhập nếu không biết ngày)<input id="f_birth_year" type="number" value="${val('birth_year')}"></label>
      </div>
      <label class="chk full"><input id="f_is_alive" type="checkbox" ${v.is_alive===false?'':'checked'}> Còn sống</label>
      <div class="dgwrap" id="deathWrap" style="${v.is_alive===false?'':'display:none'}">
        ${dateGroup('death','Ngày mất (ngày giỗ sẽ tự tính)',v.death_date, gioFallback(v))}
        <label>Năm mất (chỉ nhập nếu không biết ngày)<input id="f_death_year" type="number" value="${val('death_year')}"></label>
      </div>
      <label>Quê quán / nơi ở<input id="f_hometown" maxlength="200" value="${val('hometown')}"></label>
      <label>Nghề nghiệp<input id="f_occupation" maxlength="200" value="${val('occupation')}"></label>
      <label class="full">Phần mộ<input id="f_burial_place" maxlength="300" value="${val('burial_place')}"></label>
      <label class="full">Link ảnh (nếu có)<input id="f_photo_url" maxlength="500" value="${val('photo_url')}" placeholder="https://…"></label>
      <label class="full">Ghi chú về người này<textarea id="f_notes" rows="3" maxlength="1000">${val('notes')}</textarea></label>
      <div class="full sep">Thông tin người gửi</div>
      <label>Họ tên của bạn *<input id="c_name" maxlength="80"></label>
      <label>Số điện thoại hoặc email<input id="c_contact" maxlength="120" placeholder="Không bắt buộc, chỉ quản trị viên thấy"></label>
      <label class="full">Lời nhắn cho quản trị viên (nguồn thông tin…)<textarea id="c_note" rows="2" maxlength="1000"></textarea></label>
      <input id="c_website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    </div>
    <div class="err" id="ferr"></div>
    <div class="actions"><button class="btn primary" id="cSend">Gửi đóng góp</button><button class="btn" id="cCancel">Hủy</button></div>`);
  linkDates('birth'); linkDates('death');
  $('#f_is_alive').addEventListener('change', e=>{ $('#deathWrap').style.display = e.target.checked ? 'none' : ''; });
  if(!isEdit){
    enhancePicker($('#c_relp'),'Gõ tên người để tìm…');
    const sync=()=>{ $('#c_relp_wrap').hidden = $('#c_rel').value==='unknown'; };
    $('#c_rel').addEventListener('change',sync); sync();
  }
  $('#cCancel').onclick=()=> isEdit ? showDetail(target.id) : closeModal();
  $('#cSend').onclick=async ()=>{
    const err=m=>{ $('#ferr').textContent=m; };
    const r=readPersonFields(); if(r.err) return err(r.err);
    const name=$('#c_name').value.trim();
    if(name.length<2) return err('Vui lòng nhập họ tên của bạn.');
    const row=r.row;
    if(isEdit){
      const norm=x=>(x===''||x===undefined)?null:x;
      const changed=Object.keys(row).some(k=>norm(row[k])!==norm(target[k]));
      if(!changed) return err('Bạn chưa thay đổi thông tin nào.');
    } else {
      const rel=$('#c_rel').value, rp=$('#c_relp').value||null;
      if(rel!=='unknown' && !rp) return err('Hãy chọn người mà họ là con hoặc vợ/chồng.');
      if(rel==='child'){ const par=byId.get(rp); Object.assign(row, childParents(par), {sort_order:(kids.get(par.spouse_of||par.id)||[]).length+1}); }
      if(rel==='spouse'){ row.spouse_of=rp; }
    }
    if($('#c_website').value){ closeModal(); toast('Cảm ơn bạn đã đóng góp'); return; }   // ô bẫy chống bot
    if(!contribRateOk()) return err('Bạn đã gửi nhiều đóng góp trong thời gian ngắn. Vui lòng thử lại sau.');
    $('#cSend').disabled=true;
    const {error}=await sb.from('contributions').insert({
      kind, target_person_id:isEdit?target.id:null, payload:row,
      contributor_name:name, contributor_contact:$('#c_contact').value.trim()||null, note:$('#c_note').value.trim()||null
    });
    $('#cSend').disabled=false;
    if(error) return err('Không gửi được: '+error.message);
    openModal(`<h3>Cảm ơn bạn đã đóng góp</h3><p>Thông tin của bạn đã được gửi. Quản trị viên sẽ xem lại và đưa vào gia phả sau khi duyệt.</p><div class="actions"><button class="btn primary" id="cOk">Đóng</button></div>`);
    $('#cOk').onclick=closeModal;
  };
}

// ----- Phía quản trị -----
function updBadge(){ const n=contribs.filter(c=>c.status==='pending').length; $('#dgBadge').textContent = n||''; }
async function loadContribs(){
  if(!isAdmin){ contribs=[]; updBadge(); return; }
  const {data,error}=await sb.from('contributions').select('*').order('created_at',{ascending:false}).range(0,999);
  if(error){ toast('Không tải được đóng góp: '+error.message); return; }
  contribs=data||[]; updBadge();
}
function contribSubject(c){ return c.kind==='new_person' ? (c.payload?.full_name||'(chưa có tên)') : (byId.get(c.target_person_id)?.full_name || '(người đã bị xóa)'); }
function renderContribs(){
  if(!isAdmin) return '<div class="empty">Chỉ quản trị viên xem được mục này.</div>';
  const cnt=s=>contribs.filter(c=>c.status===s).length;
  const chips=[['pending','Chờ duyệt'],['approved','Đã duyệt'],['rejected','Từ chối']].map(([k,l])=>`<button class="chip" data-dgf="${k}" aria-pressed="${dgFilter===k}">${l} (${cnt(k)})</button>`).join('');
  const list=contribs.filter(c=>c.status===dgFilter);
  const items=list.map(c=>`<div class="citem" data-cid="${c.id}" tabindex="0">
      <span class="ck">${c.kind==='new_person'?'Thêm người':'Sửa thông tin'}</span>
      <div><div class="nm">${esc(contribSubject(c))}</div><div class="sub">${esc(c.contributor_name)}, ${esc(new Date(c.created_at).toLocaleString('vi-VN'))}</div></div></div>`).join('');
  return `<div class="chips">${chips}</div>` + (items || `<div class="empty">${dgFilter==='pending'?'Chưa có đóng góp nào chờ duyệt.':'Không có mục nào.'}</div>`);
}
function diffContrib(c){
  const t=byId.get(c.target_person_id); if(!t) return null;
  const norm=x=>(x===''||x===undefined)?null:x;
  return Object.keys(c.payload).filter(k=>FIELD_LABELS[k] && norm(c.payload[k])!==norm(t[k])).map(k=>({k,old:t[k],nw:c.payload[k]}));
}
function reviewContrib(id){
  const c=contribs.find(x=>x.id===id); if(!c) return;
  const isNew=c.kind==='new_person', pending=c.status==='pending';
  let body='', d=null;
  if(isNew){
    const rows=Object.keys(c.payload).filter(k=>FIELD_LABELS[k] && k!=='sort_order' && c.payload[k]!==null && c.payload[k]!=='').map(k=>[FIELD_LABELS[k],fmtField(k,c.payload[k])]);
    body=`<dl>${rows.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`;
  } else {
    d=diffContrib(c);
    body = d===null ? '<p class="err">Người cần sửa không còn trong gia phả.</p>'
      : d.length===0 ? '<p class="sub">Không có thay đổi nào so với dữ liệu hiện tại.</p>'
      : `<table class="diff"><tr><th>Mục</th><th>Hiện tại</th><th>Đề xuất</th></tr>${d.map(x=>`<tr><td>${esc(FIELD_LABELS[x.k])}</td><td class="old">${esc(fmtField(x.k,x.old))}</td><td class="new">${esc(fmtField(x.k,x.nw))}</td></tr>`).join('')}</table>`;
  }
  const broken = !isNew && d===null;   // đề xuất sửa nhưng người đó đã bị xóa
  const status = pending ? '' : `<p class="sub">${c.status==='approved'?'Đã duyệt':'Đã từ chối'}${c.reject_reason?': '+esc(c.reject_reason):''}</p>`;
  openModal(`
    <h3>${isNew?'Đề xuất thêm':'Đề xuất sửa'}: ${esc(contribSubject(c))}</h3>
    <div class="cwho"><b>${esc(c.contributor_name)}</b>${c.contributor_contact?', liên hệ: '+esc(c.contributor_contact):''}<br><span class="sub">${esc(new Date(c.created_at).toLocaleString('vi-VN'))}</span></div>
    ${c.note?`<div class="cnote">Lời nhắn: ${esc(c.note)}</div>`:''}
    ${body}${status}
    <div class="actions">${pending?`
      <button class="btn primary small" id="rOk" ${broken?'disabled':''}>Duyệt</button>
      <button class="btn small" id="rEdit" ${broken?'disabled':''}>Sửa rồi duyệt</button>
      <button class="btn danger small" id="rNo">Từ chối</button>`:`<button class="btn danger small" id="rDel">Xóa khỏi danh sách</button>`}
      <button class="btn small" id="rClose">Đóng</button>
    </div>`);
  $('#rClose').onclick=closeModal;
  if(pending){
    $('#rOk').onclick=async ()=>{
      if(isNew && !c.payload.father_id && !c.payload.mother_id && !c.payload.spouse_of && !confirm('Người này chưa có quan hệ cha mẹ hoặc vợ/chồng nên sẽ hiện thành một nhánh riêng. Vẫn duyệt?')) return;
      $('#rOk').disabled=true; const msg=await approveContrib(c,c.payload); if(msg){ $('#rOk').disabled=false; toast('Lỗi: '+msg); }
    };
    $('#rEdit').onclick=()=>{
      const base = isNew ? {...c.payload} : {...byId.get(c.target_person_id), ...c.payload};
      openForm(base, {}, {title:'Sửa rồi duyệt đóng góp', save:row=>approveContrib(c,row), cancel:()=>reviewContrib(c.id)});
    };
    $('#rNo').onclick=async ()=>{
      const reason=prompt('Lý do từ chối (có thể bỏ trống):'); if(reason===null) return;
      const {error}=await sb.from('contributions').update({status:'rejected',reject_reason:reason.trim()||null,reviewed_at:new Date().toISOString(),reviewed_by:adminUid}).eq('id',c.id);
      if(error){ toast('Lỗi: '+error.message); return; }
      closeModal(); toast('Đã từ chối'); await loadContribs(); render();
    };
  } else {
    $('#rDel').onclick=async ()=>{
      if(!confirm('Xóa đóng góp này khỏi danh sách?')) return;
      const {error}=await sb.from('contributions').delete().eq('id',c.id);
      if(error){ toast('Lỗi: '+error.message); return; }
      closeModal(); await loadContribs(); render();
    };
  }
}
async function approveContrib(c,row){
  const {error}=await sb.rpc('approve_contribution',{p_id:c.id,p_row:row});
  if(error) return error.message;
  closeModal(); toast('Đã duyệt và đưa vào gia phả');
  await refresh(); await loadContribs(); render();
  return null;
}
$('#btnContrib').onclick=openContribMenu;

/* ---------- Đăng nhập quản trị ---------- */
function setAdmin(on){
  isAdmin = on;
  $('#btnAuth').textContent = on ? 'Đăng xuất' : 'Quản trị';
  $('#btnAddRoot').style.display = on ? '' : 'none';
  $('#btnExport').style.display = on ? '' : 'none';
  $('#tabDg').hidden = !on;
  if(!on && tab==='dg'){ tab='tree'; document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab==='tree')); }
  if(on) loadContribs().then(render); else { contribs=[]; updBadge(); }
  render();
}
$('#btnAuth').onclick = async ()=>{
  if(!configured) return;
  if(isAdmin){ await sb.auth.signOut(); return; }
  openModal(`<h3>Đăng nhập quản trị</h3>
    <div class="fgrid"><label class="full">Email<input id="a_email" type="email" autocomplete="username"></label>
    <label class="full">Mật khẩu<input id="a_pw" type="password" autocomplete="current-password"></label></div>
    <div class="err" id="aerr"></div>
    <div class="actions"><button class="btn primary" id="aGo">Đăng nhập</button></div>`);
  const go = async ()=>{
    const {error} = await sb.auth.signInWithPassword({email:$('#a_email').value.trim(), password:$('#a_pw').value});
    if(error) $('#aerr').textContent='Sai email hoặc mật khẩu.'; else closeModal();
  };
  $('#aGo').onclick = go;
  $('#a_pw').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
};
$('#btnAddRoot').onclick = ()=>openForm({}, {sort_order:roots().length+1});
$('#btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(persons,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download = `gia-pha-ton-that-${new Date().toISOString().slice(0,10)}.json`; a.click();
};

async function refresh(){ try{ await loadAll(); }catch(e){ $('#view').innerHTML=`<div class="notice">Không tải được dữ liệu: ${esc(e.message)}<br>Kiểm tra đã chạy <code>schema.sql</code> và đúng URL/key.</div>`; return; } if(open.size===0) roots().forEach(r=>open.add(r.id)); render(); }

(async function init(){
  if(!configured){ render(); $('#btnAuth').disabled=true; return; }
  const {data:{session}} = await sb.auth.getSession();
  isAdmin = !!session; adminUid = session?.user?.id || null;
  sb.auth.onAuthStateChange((_ev, s)=>{ adminUid = s?.user?.id || null; setAdmin(!!s); });
  await refresh();
  setAdmin(isAdmin);
})();
</script>
